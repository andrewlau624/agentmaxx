tools:
  - name: better-explore
    script: better-explore/better_explore.py
    description: Repository code discovery agent. Finds candidate files for a task by searching, ranking by code relationships, and returning a prioritized reading list.
    usage: better_explore.py TASK [--path PATH] [--num-candidates N] [--max-searches N]
    note: "Reduces exploration-phase token cost. Returns ranked candidates with reasoning instead of undifferentiated search results."

  - name: better-context
    script: better-context/better_context.py
    description: Search and return the surrounding source in one call — locate + read, one round trip. Prefer this over better-grep followed by better-cat.
    usage: better_context.py QUERY [QUERY ...] [--path PATH] [--type EXT] [--max-hits N] [--context-lines N] [--max-output-chars N]

  - name: better-grep
    script: better-grep/better_grep.py
    description: Search repository code with ranked, bounded results. Accepts multiple patterns in one call.
    usage: better_grep.py QUERY [QUERY ...] [--path PATH] [--type EXT] [--max-results N] [--max-output-chars N]

  - name: better-cat
    script: better-cat/better_cat.py
    description: Read bounded file ranges without unnecessary context. Accepts multiple specs in one call.
    usage: better_cat.py SPEC [SPEC ...] [--max-output-chars N]
    spec_syntax: "path, path:12-40, path:12- or path:12"

  - name: better-edit
    script: better-edit/better_edit.py
    description: Apply a batch of exact-string edits across one or more files in one call, all-or-nothing. Prefer this over one edit call per change.
    usage: better_edit.py [EDITS_JSON] — JSON array of {path, old, new, replace_all?}; reads stdin if omitted

  - name: better-find
    script: better-find/better_find.py
    description: Find repository files with bounded, structured results, skipping generated/dependency directories.
    usage: better_find.py [PATH] [--name GLOB] [--type f|d] [--max-results N]

  - name: better-tree
    script: better-tree/better_tree.py
    description: Bounded directory tree, skipping generated/dependency directories by default.
    usage: better_tree.py [PATH] [--depth N] [--max-entries N] [--hidden] [--include-ignored]

  - name: better-blame
    script: better-blame/better_blame.py
    description: Compact git blame — one file, optional line range or revision.
    usage: better_blame.py PATH [-L START,END] [-r REVISION] [--context N] [--max-lines N]

  - name: better-git
    script: better-git/better_git.py
    description: Repository state, history, diffs, conflicts, branches, stashes, tags, remotes, and PR context.
    usage: better_git.py COMMAND [ARGS ...]
    commands:
      - status
      - branch
      - diff
      - diff-summary
      - changed
      - recent
      - log
      - inspect
      - show
      - conflicts
      - check
      - context
      - review
      - review-branch
      - commit-context
      - fix-context
      - merge-context
      - rebase-context
      - ship-context
      - branch-context
      - verify-context
      - stash
      - tag
      - remote
      - pr-context

  - name: better-check
    script: better-check/better_check.py
    description: Compact project verification — runs test/lint/typecheck/build and reports structured results.
    usage: better_check.py [--test CMD ...] [--lint CMD ...] [--typecheck CMD ...] [--build CMD ...] [--timeout N] [--max-output N] [--stop-on-failure] [--quiet]

  - name: better-lint
    script: better-lint/better_lint.py
    description: Compact lint interface — auto-detects a linter or runs an explicit command.
    usage: better_lint.py [--linter ruff|flake8|pylint|eslint|biome|clippy|go-vet] [--timeout N] [--max-output N] [--quiet] [COMMAND ...]

  - name: better-test
    script: better-test/better_test.py
    description: Run tests with bounded, structured output.
    usage: better_test.py [--framework pytest|unittest|npm] [--command CMD] [--timeout N] [--max-output N] [--quiet]

  - name: better-symbol
    script: better-symbol/better_symbol.py
    description: Universal symbol finder. Locate definitions, usages, and implementations of classes, functions, types.
    usage: better_symbol.py SYMBOL [--kind definition|usage|implementation] [--path PATH] [--max-results N]
    note: "Finds where a symbol is defined and used without multiple grep passes. ~150-250 tokens savings per lookup."

  - name: better-trace
    script: better-trace/better_trace.py
    description: Call graph tracer. Understand what calls a function and what it calls.
    usage: better_trace.py FUNCTION [--direction callers|callees|both] [--depth N] [--path PATH] [--show-entry-points] [--max-results N]
    note: "Returns call trees instead of manual tracing through imports. ~200-400 tokens savings per trace."

  - name: better-related
    script: better-related/better_related.py
    description: File relationship mapper. Find imports, imported_by, tests, and dependents in one call.
    usage: better_related.py FILE [--kind all|imports|imported_by|tests|dependents] [--path PATH] [--max-results N]
    note: "Replaces 4-5 separate grep searches with one structured call. ~150-200 tokens savings."

  - name: better-types
    script: better-types/better_types.py
    description: Type/interface signature extractor. Get type definitions without implementation.
    usage: better_types.py TYPENAME [--kind all|class|interface|type|struct] [--path PATH]
    note: "Extract type signatures without reading entire files. ~100-300 tokens savings per type."

  - name: better-error
    script: better-error/better_error.py
    description: Exception parser. Extract actionable error context from stack traces.
    usage: better_error.py [--file PATH | --content TEXT] < stacktrace.txt
    note: "Parse tracebacks and return just the failing line and cause. ~50-150 tokens savings per error."

  - name: better-diff
    script: better-diff/better_diff.py
    description: Ranked diff generator. Show what changed with minimal context.
    usage: better_diff.py PATH [--since TIME] [--commits N] [--max-output CHARS]
    note: "Generate ranked diffs with bounded output instead of massive git logs. ~100-200 tokens savings."

  - name: better-contract
    script: better-contract/better_contract.py
    description: API contract extractor. Get routes, request/response types, and handlers.
    usage: better_contract.py PATH [--format json|openapi]
    note: "Extract API contracts from route files in one call. ~150-250 tokens savings per service."

  - name: better-structure
    script: better-structure/better_structure.py
    description: Architecture graph generator. Show dependency tree, entry points, and layers.
    usage: better_structure.py [--path PATH] [--max-depth N] [--show-cycles]
    note: "Generate high-level architecture overview upfront. ~100-200 tokens savings per codebase analysis."
